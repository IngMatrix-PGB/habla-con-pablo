name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['worker/**', 'wrangler.toml', '**.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Variables del repo (Settings → Secrets and variables → Actions → Variables). Son públicas.
          PUBLIC_VOICE_API_URL: ${{ vars.PUBLIC_VOICE_API_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_DAILY_CALLS_PER_IP: ${{ vars.PUBLIC_DAILY_CALLS_PER_IP }}
          PUBLIC_MAX_CALL_SECONDS: ${{ vars.PUBLIC_MAX_CALL_SECONDS }}
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
