# Cloudflare Worker que emite los tokens de voz. Ver README → "Deploy del Worker".
name = "habla-con-pablo-voice"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://ingmatrix-pgb.github.io,http://localhost:4321"
REALTIME_MODEL = "gpt-realtime"
REALTIME_VOICE = "ash"         # voz masculina; el efecto robot se aplica en el navegador
MAX_CALL_SECONDS = "300"        # minutos de voz por IP al día
RESUME_WINDOW_SECONDS = "1800"  # se puede pausar y reanudar durante 30 min
MAX_SESSIONS_PER_DAY = "3"    # en cuántas partes se pueden repartir esos minutos

# Creado con: npx wrangler kv namespace create RATE_LIMIT
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "ff707fce445b47d28519e86fd1b194bd"

[observability]
enabled = true
